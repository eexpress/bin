<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .raindrop{
      animation: fall 1.2s infinite linear;
      opacity:0;
      fill:#4488dd;
    }
    @keyframes fall {
      0%   { opacity:0; transform: translate(0,0); }
      35%  { opacity:0.9; }
      85%  { opacity:0.9; }
      100% { opacity:0; transform: translate(8px,30px); }
    }
  </style>

  <defs>
    <!-- 雨滴：已上下+左右翻转，尖端朝下 -->
