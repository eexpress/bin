       C107.46,46.11 104.40,46.04 102.83,46.12 Z"/>

  <!-- 雨滴随云朵整体下移一点，但仍保持紧凑 -->
  <g transform="translate(70, 112)">
    <use href="#raindrop-base" class="raindrop" style="fill:#44ee44;animation-delay:0.0s;"/>
  </g>
  <g transform="translate(93, 116)">
    <use href="#raindrop-base" class="raindrop" style="fill:#ee88dd;animation-delay:1.3s;"/>
